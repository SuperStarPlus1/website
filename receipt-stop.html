<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הפסקת העתקי קבלות — סופרסטאר</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<!-- The link at the bottom of an e-mailed receipt copy (16/10/2026): receipt-stop?t=<the address's token> → no more
     copies to that address (api/club-receipt-mail.ts, clubReceiptStop). The purchases and the club are not affected. -->
<style>
  :root { --blue: #0076DA; --blue-d: #005bb0; --ink: #1f2937; --muted: #64748b; --ok: #2e7d32; --bad: #c62828; --bg: #eef4fa; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 "Segoe UI", Tahoma, Arial, sans-serif; }
  .top { max-width: 560px; margin: 0 auto; padding: 12px 16px; }
  .top img { height: 44px; }
  .card { max-width: 560px; margin: 10px auto; background: #fff; border-radius: 20px; padding: 24px 18px; box-shadow: 0 8px 30px rgba(0, 60, 120, .08); text-align: center; }
  @media (max-width: 600px) { .card { margin: 10px 16px; } }
  h1 { color: var(--blue-d); font-size: 24px; margin: 6px 0 8px; }
  .big { font-size: 48px; }
  .muted { color: var(--muted); font-size: 14.5px; }
  button { margin-top: 14px; background: #fff; color: var(--blue-d); border: 2px solid #dbe3ec; border-radius: 14px; padding: 11px 20px; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<header class="top"><a href="/"><img src="logo.png" alt="סופרסטאר"></a></header>
<main class="card" id="box"><p class="muted">רגע…</p></main>
<script>
(function () {
  'use strict';
  const API = 'https://otjhhljgdevazanrretx.supabase.co/functions/v1/api';
  const t = (new URLSearchParams(location.search).get('t') || '').trim().toLowerCase();
  const box = document.getElementById('box');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  async function go(resume) {
    let r;
    try { r = await (await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'clubReceiptStop', t, resume }) })).json(); } catch (e) { r = { ok: false }; }
    if (!r.ok) { box.innerHTML = '<div class="big">⚠️</div><h1>הקישור אינו תקין</h1><p class="muted">אפשר לפנות אלינו בחנות.</p>'; return; }
    box.innerHTML = r.stopped
      ? '<div class="big">✓</div><h1>העתקי הקבלות הופסקו</h1><p>לא יישלחו יותר העתקי קבלות למייל <b dir="ltr">' + esc(r.email) + '</b>.</p><p class="muted">הקניות, המועדון וההטבות — ללא שינוי.</p><button type="button" id="again">טעות? לחידוש השליחה</button>'
      : '<div class="big">📧</div><h1>השליחה חודשה</h1><p>העתקי הקבלות יישלחו שוב למייל <b dir="ltr">' + esc(r.email) + '</b>.</p>';
    const b = document.getElementById('again');
    if (b) b.addEventListener('click', () => go(true));
  }
  if (!/^[0-9a-f]{24}$/.test(t)) { box.innerHTML = '<div class="big">⚠️</div><h1>הקישור אינו תקין</h1>'; return; }
  go(false);
})();
</script>
</body>
</html>
