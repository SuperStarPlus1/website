<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>האזור האישי — מועדון סופרסטאר</title>
<meta name="description" content="האזור האישי של חברי מועדון סופרסטאר — כרטיס המועדון, הפרטים שלכם והמבצעים.">

<!-- The customers' personal area (16/10/2026). Server: supabase/functions/api/club-app.ts (clubAppStart / clubAppVerify /
     clubAppMe / clubAppLogout). Sign-in: ID number + a one-time SMS code. A customer who did not fill the club form and
     agree to the mailings is sent to the form (club?i=…&from=app) and comes back here after it. -->
<style>
  :root { --blue: #0076DA; --blue-d: #005bb0; --yellow: #ffcc00; --ink: #1f2937; --muted: #64748b; --line: #dbe3ec; --bad: #c62828; --ok: #2e7d32; --bg: #eef4fa; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 "Segoe UI", Tahoma, Arial, sans-serif; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; max-width: 640px; margin: 0 auto; }
  .top img { height: 44px; }
  .lang { display: flex; background: #fff; border: 1.5px solid var(--line); border-radius: 99px; padding: 3px; }
  .lang button { border: 0; background: none; font: inherit; font-size: 14px; padding: 5px 12px; border-radius: 99px; cursor: pointer; color: var(--muted); }
  .lang button.on { background: var(--blue); color: #fff; font-weight: 700; }
  main { max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }
  .card { background: #fff; border-radius: 20px; padding: 20px 18px; box-shadow: 0 8px 30px rgba(0, 60, 120, .08); margin-top: 14px; }

  h2 { font-size: 18px; margin: 0 0 10px; }
  .sub { color: var(--muted); margin: 0 0 14px; font-size: 15px; }
  label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  input { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 11px 12px; font: inherit; font-size: 20px; letter-spacing: 2px; min-height: 52px; direction: ltr; text-align: center; background: #fff; color: var(--ink); }
  input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0, 118, 218, .15); }
  .btn { display: block; width: 100%; margin-top: 14px; background: var(--blue); color: #fff; border: 0; border-radius: 14px; padding: 14px; font: inherit; font-size: 18px; font-weight: 800; cursor: pointer; text-align: center; text-decoration: none; box-shadow: 0 6px 18px rgba(0, 118, 218, .25); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.plain { background: #fff; color: var(--blue-d); border: 2px solid var(--line); box-shadow: none; font-size: 16px; padding: 11px; }
  .link { background: none; border: 0; color: var(--blue); text-decoration: underline; font: inherit; font-size: 14px; cursor: pointer; padding: 0; }
  .link:disabled { color: var(--muted); text-decoration: none; cursor: default; }
  .msg { margin-top: 10px; font-size: 14.5px; text-align: center; min-height: 1em; }
  .msg.err { color: var(--bad); font-weight: 700; }

  .clubcard { border-radius: 20px; padding: 18px; color: #fff; background: linear-gradient(135deg, #0076DA 0%, #004f99 100%); box-shadow: 0 10px 30px rgba(0, 80, 160, .3); position: relative; overflow: hidden; }
  .clubcard::after { content: ""; position: absolute; inset-inline-end: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255, 204, 0, .25); }
  .clubcard .nm { font-size: 22px; font-weight: 800; }
  .clubcard .lbl { opacity: .85; font-size: 13px; }

  .clubcard .no { color: var(--ink); font: 700 18px/1.2 Consolas, monospace; letter-spacing: 2px; direction: ltr; }

  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-weight: 600; }
  .kv .ltr { direction: ltr; unicode-bidi: isolate; text-align: start; }

  .tile b { display: block; font-size: 15px; }

  .gift.due { background: #e8f5e9; border-color: #a5d6a7; }
  .list { list-style: none; margin: 0; padding: 0; }

  details.rc summary::-webkit-details-marker { display: none; }

  .rcpdf:disabled { opacity: .6; cursor: default; }
  /* 18/10/2026: the savings, "when did I buy", the shopping list */
  .saved2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .saved2 .stat b { color: var(--ok); }
  input.tin { font-size: 16px; letter-spacing: 0; direction: rtl; text-align: right; min-height: 46px; padding: 9px 12px; }
  .srch, .sladd { display: flex; gap: 8px; align-items: stretch; }
  .srch input, .sladd input { flex: 1 1 auto; width: auto; min-width: 0; }
  .srch .btn, .sladd .btn { width: auto; margin: 0; padding: 0 16px; font-size: 16px; white-space: nowrap; }
  .hit { padding: 9px 0; border-bottom: 1px solid #eef2f7; font-size: 14.5px; }
  .hit:last-child { border-bottom: 0; }
  .hit .rcpdf { margin: 6px 0 0; padding: 5px 10px; font-size: 12.5px; }
  .sl { list-style: none; margin: 10px 0 0; padding: 0; }
  .sl li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eef2f7; font-size: 15px; }
  .sl li input { width: 22px; height: 22px; min-height: 0; flex: 0 0 auto; margin: 0; accent-color: var(--blue); }
  .sl li .t { flex: 1; }
  .sl li.done .t { text-decoration: line-through; color: var(--muted); }
  .sl .x { border: 0; background: none; color: var(--bad); font-size: 18px; cursor: pointer; padding: 0 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { border: 1px solid var(--line); background: #f6f9fd; border-radius: 999px; padding: 6px 11px; font: inherit; font-size: 13.5px; cursor: pointer; color: var(--ink); }
  .chip.deal { border-color: #f2c94c; background: #fff8db; }
  .dealtag { display: inline-block; background: #fff3bf; color: #8a5a00; border-radius: 8px; padding: 1px 7px; font-size: 12px; font-weight: 700; margin-inline-start: 6px; }
  .slbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .slbar button { flex: 1 1 140px; margin: 0; font-size: 15px; padding: 10px; }
  .rsms { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 14px; color: #334155; cursor: pointer; }
  .rsms input { width: 18px; height: 18px; accent-color: #0076DA; }
  details.rc.hit { background: #fffbe6; border-radius: 8px; padding: 8px; }
  details.rc .ln { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: #475569; padding: 2px 0; }
  .deal { background: #eaf4ff; border-radius: 12px; padding: 9px 12px; margin-top: 8px; font-size: 14px; }
  .deal b { color: var(--blue-d); }
  .muted { color: var(--muted); font-size: 14px; }
  .vcard { border-radius: 20px; padding: 16px; color: #fff; background: linear-gradient(135deg, #1f2937 0%, #0f766e 100%); box-shadow: 0 10px 30px rgba(15, 118, 110, .3); }
  .vcard .nm { font-size: 18px; font-weight: 800; }
  .vcard .bc { background: #fff; border-radius: 12px; padding: 14px 12px 8px; margin-top: 10px; text-align: center; cursor: zoom-in; }
  .vcard .bc svg { display: block; width: 100%; height: 84px; }
  .vcard .zoom { color: #0f766e; font-size: 13px; font-weight: 700; margin-top: 4px; }
  /* 17/10/2026: the card's code is 37 digits — small on a phone it is too dense for the register's scanner; a tap opens
     it full screen, turned along the phone's length (about 2.5 times wider bars), on white with wide quiet zones */
  .bcfull { position: fixed; inset: 0; z-index: 60; background: #fff; display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
  .bcfull .rot { flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(94vw, 1100px); }
  .bcfull svg { display: block; width: 100%; height: min(34vh, 240px); }
  .bcfull .no { color: #111; font: 700 18px/1.2 Consolas, monospace; letter-spacing: 1px; direction: ltr; }
  .bcfull .x { color: #555; font-size: 14px; }
  @media (orientation: portrait) { .bcfull .rot { width: min(94vh, 94dvh); transform: rotate(90deg); } .bcfull svg { height: min(56vw, 240px); } }
  .vcard .no { color: var(--ink); font: 700 16px/1.2 Consolas, monospace; letter-spacing: 1px; direction: ltr; }
  .vcard .bal { font-size: 26px; font-weight: 800; direction: ltr; unicode-bidi: isolate; }
  .warn { background: #fff4e5; border-radius: 12px; padding: 8px 12px; font-size: 13px; color: #7c4a03; margin-top: 10px; }
  .greet { border-radius: 20px; padding: 18px; text-align: center; background: linear-gradient(135deg, #fff8db 0%, #ffe9a8 100%); border: 1.5px solid #ffd76a; margin-top: 14px; }

  .greet h2 { color: var(--blue-d); margin: 6px 0 6px; font-size: 21px; }
  .greet p { margin: 0; white-space: pre-line; }
  .greet img { max-width: 100%; border-radius: 12px; margin-top: 10px; }
  .coupon { display: flex; gap: 12px; align-items: center; border: 2px dashed #f59e0b; background: #fffbeb; border-radius: 16px; padding: 12px 14px; margin-top: 8px; }
  .coupon .pct { font-size: 28px; font-weight: 900; color: #b45309; direction: ltr; white-space: nowrap; }
  .coupon b { display: block; }
  .pop { position: fixed; inset: 0; background: rgba(15, 23, 42, .55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .pop .in { background: #fff; border-radius: 22px; padding: 22px 18px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
  .pop .in .em { font-size: 50px; }
  .pop .in .pct { font-size: 40px; font-weight: 900; color: #b45309; direction: ltr; }
  .badge { display: inline-block; background: #e8f5e9; color: var(--ok); border-radius: 99px; padding: 2px 10px; font-size: 13px; font-weight: 700; }
  .badge.off { background: #fdecea; color: var(--bad); }
  .foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 18px; }
  .foot a { color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <a href="/"><img src="logo.png" alt="סופרסטאר"></a>
  <div class="lang" role="group" aria-label="שפה / اللغة"><button type="button" data-ui="he">עברית</button><button type="button" data-ui="ar">العربية</button></div>
</header>
<main>
  <!-- sign-in: 1. the ID number -->
  <section id="stepId" hidden>
    <h1 data-t="h1"></h1>
    <p class="sub" data-t="lead"></p>
    <div class="card">
      <form id="fId" novalidate>
        <label for="idNumber" data-t="idLbl"></label>
        <input id="idNumber" inputmode="numeric" autocomplete="off" maxlength="9" placeholder="•••••••••">
        <label for="phone" data-t="phoneLbl" style="margin-top:12px"></label>
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="13" placeholder="05X-XXXXXXX">
        <p class="sub" style="margin:8px 0 0;font-size:13.5px" data-t="phoneHint"></p>
        <button class="btn" id="bId" type="submit" data-t="sendCode"></button>
        <div class="msg" id="mId" role="status"></div>
      </form>
    </div>
  </section>
  <!-- sign-in: 2. the code -->
  <section id="stepCode" hidden>
    <h1 data-t="codeH"></h1>
    <p class="sub" id="codeSub"></p>
    <div class="card">
      <form id="fCode" novalidate>
        <label for="code" data-t="codeLbl"></label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
        <button class="btn" id="bCode" type="submit" data-t="enter"></button>
        <div class="msg" id="mCode" role="status"></div>
        <div class="row"><button type="button" class="link" id="resend"></button><button type="button" class="link" id="otherId" data-t="otherId"></button></div>
      </form>
    </div>
  </section>
  <!-- not a full member yet → the form -->
  <section id="stepForm" hidden>
    <h1 id="formH"></h1>
    <div class="card">
      <p data-t="formWhy"></p>
      <a class="btn" id="formGo" data-t="formGo"></a>
      <button class="btn plain" type="button" id="formLater" data-t="logout"></button>
    </div>
  </section>
  <!-- the area -->
  <section id="area" hidden>
    <h1 id="hello"></h1>
    <div class="clubcard" style="margin-top:12px">
      <div class="lbl" data-t="cardT"></div>
      <div class="nm" id="cName"></div>
      <div class="bc"><svg id="barcode"></svg><div class="no" id="cNo"></div></div>
      <div class="lbl" style="margin-top:8px;position:relative;z-index:1" data-t="cardHint"></div>
    </div>
    <div id="greet"></div>
    <div id="coupons"></div>
    <div id="vc"></div>
    <div id="purch"></div>
    <div id="slist"></div>
    <div class="card">
      <a class="tile go" href="/mivtzaim" style="display:block"><b data-t="t1"></b><small data-t="t1s"></small></a>
    </div>
    <div class="card">
      <h2 data-t="detailsH"></h2>
      <dl class="kv" id="kv"></dl>
      <a class="btn plain" id="editGo" data-t="edit"></a>
    </div>
    <div class="card">
      <h2 data-t="mailH"></h2>
      <p id="mailSt" style="margin:0 0 6px"></p>
      <a class="link" id="unsubGo" data-t="mailManage"></a>
    </div>
    <button class="btn plain" type="button" id="logout" data-t="logout"></button>
  </section>
  <p class="foot"><a href="/club-terms" data-t="terms"></a> · <a href="/club-privacy" data-t="privacy"></a></p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>

        '<div class="pct">' + esc(p.percent) + '%</div><p style="margin:4px 0"><b>' + esc(p.name) + '</b></p><p class="muted">' + esc(t.cpUntil(dmy(p.validTo))) + '</p>' +
        '<button class="btn" type="button" id="cpPopOk">' + esc(t.popOk) + '</button></div></div>');
      $('cpPopOk').addEventListener('click', () => { $('cpPop').remove(); api({ action: 'clubAppCouponSeen', s: store.get('ss_club_s'), id: p.id }); me.coupons.popup = null; });
    }
  }
  function drawValueCard() {
    const t = I[ui], v = me.valueCard, box = $('vc');
    if (!me.valueCardsOn) { box.innerHTML = ''; return; }   // 17/10/2026: off (magnetic-stripe only at the register, no PIN)
    if (!v) {
      box.innerHTML = '<div class="card"><h2>' + esc(t.vcH) + '</h2><p class="muted" style="margin:0 0 4px">' + esc(t.vcWhy) + '</p>' +
        '<button class="btn" type="button" id="vcIssue">' + esc(t.vcIssue) + '</button><div class="msg" id="vcMsg"></div></div>';
      $('vcIssue').addEventListener('click', async () => {
        $('vcIssue').disabled = true;
        const r = await api({ action: 'clubAppCardIssue', s: store.get('ss_club_s') });
        $('vcIssue').disabled = false;
        if (!r.ok) { $('vcMsg').className = 'msg err'; $('vcMsg').textContent = r.error || t.net; return; }
        me.valueCard = r.valueCard; drawValueCard();
      });
      return;
    }
    box.innerHTML = '<div class="card"><h2>' + esc(t.vcH) + '</h2><div class="vcard"><div class="nm">' + esc(t.vcName) + '</div>' +
      '<div class="bc" id="vcBc" role="button" tabindex="0" aria-label="' + esc(t.vcZoom) + '"><svg id="vcBar" preserveAspectRatio="none"></svg><div class="no">' + esc(t.vcNo) + ' ' + esc(v.cardNo) + '</div><div class="zoom">' + esc(t.vcZoom) + '</div></div>' +
      (v.balance !== null ? '<div style="margin-top:10px">' + esc(t.vcBal) + '</div><div class="bal">' + esc(money(v.balance)) + '</div><div style="font-size:12.5px;opacity:.85">' + esc(t.vcBalAt(dmy(v.balanceAt) + ' ' + (v.balanceAt || '').slice(11, 16))) + '</div>' : '') +
      '</div>' + (v.active ? '' : '<p class="muted" style="margin:10px 0 0">' + esc(t.vcNew) + '</p>') +
      (v.tx && v.tx.length ? '<h2 style="margin:14px 0 4px;font-size:15px">' + esc(t.vcTx) + '</h2><ul class="list">' + v.tx.map((x) =>
        '<li><span>' + esc(dmy(x.at)) + ' ' + esc(x.at.slice(11, 16)) + ' · ' + esc(x.kind === 'load' ? t.vcLoad : t.vcPay) + '</span><span class="num">' + (x.kind === 'load' ? '+' : '-') + esc(money(x.amount)) + '</span></li>').join('') + '</ul>' : '') +
      '<div class="warn">' + esc(t.vcWarn) + '</div></div>';
    try { if (window.JsBarcode) JsBarcode('#vcBar', v.code, { format: 'CODE128', displayValue: false, height: 66, margin: 0 }); } catch (e) {}
    $('vcBar').setAttribute('preserveAspectRatio', 'none');
    const open = () => {
      const o = document.createElement('div');
      o.className = 'bcfull'; o.setAttribute('role', 'dialog');
      o.innerHTML = '<div class="rot"><svg id="vcBarFull" preserveAspectRatio="none"></svg><div class="no">' + esc(t.vcNo) + ' ' + esc(v.cardNo) + '</div><div class="x">' + esc(t.vcClose) + '</div></div>';
      document.body.appendChild(o);
      try { JsBarcode('#vcBarFull', v.code, { format: 'CODE128', displayValue: false, height: 100, margin: 24 }); } catch (e) {}
      $('vcBarFull').setAttribute('preserveAspectRatio', 'none');
      o.addEventListener('click', () => o.remove());
    };
    $('vcBc').addEventListener('click', open);
    $('vcBc').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  }
  function drawPurchases() {
    const t = I[ui], p = me.purchases, box = $('purch');
    if (!p) { box.innerHTML = ''; return; }
    if (p.loading) { box.innerHTML = '<div class="card"><p class="muted" style="margin:0">' + esc(t.pLoading) + '</p></div>'; return; }
    if (!p.count) { box.innerHTML = '<div class="card"><p class="muted" style="margin:0">' + esc(t.pNone) + '</p></div>'; return; }
    const b = p.benefit, L = ui;
    let h = '<div class="card"><div class="stats">' +
      '<div class="stat"><b>' + esc(dmy(p.lastAt)) + '</b><small>' + esc(t.pLast) + '</small></div>' +
      '<div class="stat"><b>' + esc(money(p.avgBasket)) + '</b><small>' + esc(t.pAvg) + '</small></div>' +
      '<div class="stat"><b>' + esc(p.count) + '</b><small>' + esc(t.pCount) + '</small></div></div></div>';
    if (p.saved && (p.saved.month > 0 || p.saved.year > 0)) {
      const yearStart = new Date().getFullYear() + '-01-01';
      h += '<div class="card"><h2>' + esc(t.savedH) + '</h2><div class="saved2">' +
        '<div class="stat"><b>' + esc(money(p.saved.month)) + '</b><small>' + esc(t.savedMonth) + '</small></div>' +
        '<div class="stat"><b>' + esc(money(p.saved.year)) + '</b><small>' + esc(t.savedYear) + '</small></div></div>' +
        '<p class="muted" style="margin:8px 0 0;font-size:12.5px">' + esc(t.savedNote(p.saved.from > yearStart ? dmy(p.saved.from) : '')) + '</p></div>';
    }
    h += '<div class="card"><h2>' + esc(t.giftH) + '</h2><div class="gift' + (b.due ? ' due' : '') + '">' +
      '<b>' + esc(b.due ? t.giftDue : t.giftToGo(b.toGo)) + '</b>' +
      '<div class="bar"><i style="width:' + Math.round(b.done / 40 * 100) + '%"></i></div>' +
      '<div class="muted">' + esc(t.giftProg(b.done)) + (b.expected ? ' · ' + esc(t.giftExp(b.expected)) : '') + '</div></div>' +
      '<p class="muted" style="margin:8px 0 0;font-size:12.5px">' + esc(t.giftNote) + '</p>' +
      (b.history && b.history.length ? '<h2 style="margin:14px 0 4px;font-size:15px">' + esc(t.giftHist) + '</h2><ul class="list">' +
        b.history.map((x) => '<li><span>' + esc(dmy(x.at)) + '</span><span class="num">' + esc(money(x.amount)) + '</span></li>').join('') + '</ul>' : '') + '</div>';
    if (p.forYou && p.forYou.length) h += '<div class="card"><h2>' + esc(t.forYouH) + '</h2>' + p.forYou.map((f) =>
      '<div class="deal"><b>' + esc(f.deal[L] || f.deal.he) + '</b>' + (f.note[L] || f.note.he ? '<div class="muted">' + esc(f.note[L] || f.note.he) + '</div>' : '') +
      '<div class="muted">' + esc(f.name) + (f.validTo ? ' · ' + esc(t.validTo) + ' ' + esc(dmy(f.validTo)) : '') + '</div></div>').join('') + '</div>';
    if (p.recent && p.recent.length) h += '<div class="card"><h2>' + esc(t.recentH) + '</h2>' + p.recent.map((r) =>
      '<details class="rc" data-rk="' + esc(r.rkey) + '"><summary><span>' + esc(dmy(r.at)) + ' ' + esc(r.at.slice(11, 16)) + ' · ' + esc(t.reg) + ' ' + esc(r.register) + '</span><span class="num">' + esc(money(r.total)) + '</span></summary>' +
      (r.benefit ? '<div class="ln"><span>🎁 ' + esc(t.benefitLine) + '</span><span class="num">-' + esc(money(r.benefit)) + '</span></div>' : '') +
      (r.lines || []).filter((l) => l[0] !== '-99' && l[0] !== '5651356').map((l) => '<div class="ln"><span>' + esc(l[1]) + (l[2] !== 1 ? ' × ' + esc(l[2]) : '') + '</span><span class="num">' + esc(money(l[4])) + '</span></div>').join('') +
      (r.lines && r.lines.length ? '<button type="button" class="rcpdf" data-rk="' + esc(r.rkey) + '" data-at="' + esc(r.at.slice(0, 10)) + '">' + esc(t.rcPdf) + '</button><div class="msg err rcErr"></div>'
        : '<p class="muted" style="margin:6px 0 0;font-size:13px">' + esc(t.rcNone) + '</p>') +
      '</details>').join('') +
      (me.viewOnly ? '' : '<label class="rsms"><input type="checkbox" id="rsms"' + (me.receiptSms !== false ? ' checked' : '') + '> <span>' + esc(t.rsms) + '</span></label>') + '</div>';
    if (p.top && p.top.length) h += '<div class="card"><h2>' + esc(t.topH) + '</h2><ul class="list">' + p.top.map((x) =>
      '<li><span>' + esc(x.name) + '</span><span class="n">' + esc(t.times(x.times)) + '</span></li>').join('') + '</ul></div>';
    h += '<div class="card"><h2>' + esc(t.searchH) + '</h2><form class="srch" id="srchF"><input class="tin" id="srchQ" maxlength="60" autocomplete="off" placeholder="' + esc(t.searchPh) + '">' +
      '<button class="btn" type="submit">' + esc(t.searchGo) + '</button></form><div id="srchR"></div></div>';
    box.innerHTML = h;
  }
  /** "when did I buy X" (clubAppSearch): each hit with its copy */
  async function searchBuy() {
    const t = I[ui], q = $('srchQ').value.trim(), out = $('srchR');
    if (q.length < 2) return;
    out.innerHTML = '<p class="muted">' + esc(t.searchWait) + '</p>';
    const r = await api({ action: 'clubAppSearch', s: store.get('ss_club_s'), q });
    if (!r.ok) { out.innerHTML = '<p class="msg err">' + esc(r.error || t.net) + '</p>'; return; }
    out.innerHTML = (r.hits.length ? r.hits.map((x) => '<div class="hit"><b>' + esc(x.name) + '</b><div class="muted">' + esc(dmy(x.at)) + ' ' + esc(x.at.slice(11, 16)) + ' · ' + esc(t.reg) + ' ' + esc(x.register) +
      (x.ret ? ' · ' + esc(t.searchRet) : '') + ' · ' + esc(x.qty !== 1 ? x.qty + ' × ' + money(x.unit) + ' = ' : '') + esc(money(x.total)) + '</div>' +
      '<button type="button" class="rcpdf" data-rk="' + esc(x.rkey) + '" data-at="' + esc(x.at.slice(0, 10)) + '">' + esc(t.rcPdf) + '</button><div class="msg err rcErr"></div></div>').join('')
      : '<p class="muted">' + esc(t.searchNone) + '</p>') + (r.from ? '<p class="muted" style="font-size:12.5px;margin:8px 0 0">' + esc(t.searchFrom(dmy(r.from))) + '</p>' : '');
  }

  /* ---------- 🛒 the shopping list (clubAppMe.list, saved by clubAppListSave) ---------- */
  let list = { items: [], suggest: [] }, saveTimer = 0;
  const dealOf = (d) => d ? (d[ui] || d.he || '') : '';
  function drawList() {
    const t = I[ui], box = $('slist'), ro = !!me.viewOnly;
    if (!box) return;
    if (!me.list) { box.innerHTML = ''; return; }   // the staff's look at a customer who did not join yet
    if (!box.dataset.ready) {
      box.innerHTML = '<div class="card"><h2>' + esc(t.listH) + '</h2>' + (ro ? '' : '<form class="sladd" id="slF"><input class="tin" id="slQ" maxlength="80" autocomplete="off" placeholder="' + esc(t.listPh) + '"><button class="btn" type="submit">' + esc(t.listAdd) + '</button></form>') +
        '<ul class="sl" id="slItems"></ul><div id="slBar"></div><div id="slSug"></div><p class="msg" id="slMsg"></p></div>';
      box.dataset.ready = '1';
    }
    $('slItems').innerHTML = list.items.length ? list.items.map((x) => '<li class="' + (x.done ? 'done' : '') + '" data-id="' + esc(x.id) + '"><input type="checkbox"' + (x.done ? ' checked' : '') + (ro ? ' disabled' : '') + '>' +
      '<span class="t">' + esc(x.t) + (dealOf(x.deal) ? '<span class="dealtag" title="' + esc(dealOf(x.deal)) + '">🏷 ' + esc(t.dealTag) + '</span><div class="muted" style="font-size:12.5px">' + esc(dealOf(x.deal)) + '</div>' : '') + '</span>' +
      (ro ? '' : '<button type="button" class="x" aria-label="✕">✕</button>') + '</li>').join('') : '<li class="muted" style="border:0">' + esc(t.listEmpty) + '</li>';
    $('slBar').innerHTML = list.items.length ? '<div class="slbar">' + (ro || !list.items.some((x) => x.done) ? '' : '<button type="button" class="btn plain" id="slClear">' + esc(t.listClear) + '</button>') +
      '<button type="button" class="btn plain" id="slShare">' + esc(t.listShare) + '</button></div>' : '';
    const sug = ro ? [] : list.suggest.filter((g) => !list.items.some((x) => x.b && x.b === g.b));
    $('slSug').innerHTML = sug.length ? '<p class="muted" style="margin:12px 0 0">' + esc(t.listSug) + '</p><div class="chips">' + sug.map((g) =>
      '<button type="button" class="chip' + (g.deal ? ' deal' : '') + '" data-b="' + esc(g.b) + '">＋ ' + esc(g.t) + (g.deal ? ' 🏷' : '') + '</button>').join('') + '</div>' : '';
  }
  function saveList() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      const r = await api({ action: 'clubAppListSave', s: store.get('ss_club_s'), items: list.items.map((x) => ({ id: x.id, t: x.t, b: x.b, done: x.done })) });
      const m = $('slMsg');
      if (!r.ok) { if (m) { m.className = 'msg err'; m.textContent = r.error || I[ui].listErr; } return; }
      if (m) { m.className = 'msg ok'; m.textContent = ''; }
      // the server's deals (a product just added gets its promotion) — the order and the ticks stay as they are now
      const by = new Map(r.list.items.map((x) => [x.id, x]));
      list.items = list.items.map((x) => by.has(x.id) ? { ...x, deal: by.get(x.id).deal } : x);
      list.suggest = r.list.suggest;
      drawList();
    }, 600);
  }
  const newId = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  $('slist').addEventListener('submit', (ev) => {
    if (ev.target.id !== 'slF') return;
    ev.preventDefault();
    const v = $('slQ').value.trim();
    if (!v) return;
    list.items.push({ id: newId(), t: v, b: '', done: false });
    $('slQ').value = '';
    drawList(); saveList();
  });
  $('slist').addEventListener('click', (ev) => {
    const chip = ev.target.closest('.chip');
    if (chip) { const g = list.suggest.find((x) => x.b === chip.dataset.b); if (g) { list.items.push({ id: newId(), t: g.t, b: g.b, done: false, deal: g.deal }); drawList(); saveList(); } return; }
    const x = ev.target.closest('.x');
    if (x) { const id = x.closest('li').dataset.id; list.items = list.items.filter((i) => i.id !== id); drawList(); saveList(); return; }
    if (ev.target.id === 'slClear') { list.items = list.items.filter((i) => !i.done); drawList(); saveList(); return; }
    if (ev.target.id === 'slShare') {
      const left = list.items.filter((i) => !i.done);
      const text = I[ui].listShareH + '\n' + (left.length ? left : list.items).map((i) => '• ' + i.t).join('\n');
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
    }
  });
  $('slist').addEventListener('change', (ev) => {
    if (ev.target.type !== 'checkbox') return;
    const it = list.items.find((i) => i.id === ev.target.closest('li').dataset.id);
    if (it) { it.done = ev.target.checked; drawList(); saveList(); }
  });

  /** the copy of a receipt (a PDF from the server) — saved / opened by the phone */
  async function receiptPdf(rk, btn) {
    const s = store.get('ss_club_s');
    if (!s || !rk) return;
    const was = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = I[ui].rcWait; }
    const r = await api({ action: 'clubAppReceipt', s, rkey: rk });
    if (btn) { btn.disabled = false; btn.textContent = was; }
    const err = btn && btn.parentNode.querySelector('.rcErr');
    if (err) err.textContent = r.ok ? '' : (r.error || I[ui].net);
    if (!r.ok) { if (!err) alertBox(r.error || I[ui].net); return; }
    const bin = atob(r.pdf), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u8], { type: 'application/pdf' }));
    const a = document.createElement('a'); a.href = url; a.download = (btn && btn.dataset.at ? 'superstar-' + btn.dataset.at + '-' : '') + (r.name || 'receipt.pdf'); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  function alertBox(msg) {
    const box = $('purch'); if (!box) return;
    let m = document.getElementById('rcMsg');
    if (!m) { m = document.createElement('div'); m.id = 'rcMsg'; m.className = 'msg err'; box.prepend(m); }
    m.textContent = msg;
  }
  $('purch').addEventListener('click', (ev) => {
    const b = ev.target.closest('.rcpdf');
    if (b) receiptPdf(b.dataset.rk, b);
  });
  $('purch').addEventListener('submit', (ev) => { if (ev.target.id === 'srchF') { ev.preventDefault(); searchBuy(); } });
  $('purch').addEventListener('change', async (ev) => {
    if (ev.target.id !== 'rsms') return;
    const on = ev.target.checked, r = await api({ action: 'clubAppReceiptSms', s: store.get('ss_club_s'), on });
    if (!r.ok) { ev.target.checked = !on; alertBox(r.error || I[ui].net); return; }
    me.receiptSms = on;
  });
  /** the SMS link club-me?r=<rkey>: after the sign-in, that receipt — opened, marked, its copy downloaded */
  let wantReceipt = new URLSearchParams(location.search).get('r') || '';
  function openWanted() {
    if (!wantReceipt) return;
    const rk = wantReceipt; wantReceipt = '';
    try { const u = new URL(location.href); u.searchParams.delete('r'); history.replaceState(null, '', u.pathname + u.search + u.hash); } catch (e) {}
    const d = Array.from(document.querySelectorAll('details.rc')).find((x) => x.dataset.rk === rk);
    if (d) { d.open = true; d.classList.add('hit'); d.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    receiptPdf(rk, d ? d.querySelector('.rcpdf') : null);
  }
  async function load() {
    const s = store.get('ss_club_s');
    if (!s) { show('stepId'); return; }
    const r = await api({ action: 'clubAppMe', s });
    if (!r.ok) { if (r.signIn) { leaveView(); store.set('ss_club_s', null); } show('stepId'); return; }
    me = r;
    if (!r.open) {
      show('stepForm'); $('formH').textContent = I[ui].formH(r.firstName);
      $('formGo').href = r.formUrl + (ui === 'ar' ? '&lang=ar' : '');
      return;
    }
    show('area'); drawArea();
    if (!r.viewOnly) openWanted();
    if (r.viewOnly && !document.getElementById('viewBar')) document.body.insertAdjacentHTML('afterbegin', '<div id="viewBar" style="position:sticky;top:0;z-index:60;background:#7c2d12;color:#fff;text-align:center;padding:8px;font-weight:700">👁 תצוגת מנהל — ' +
      (r.notMember ? 'הלקוח עוד לא עדכן פרטים: כך ייראה האזור כשיצטרף (הנתונים מקומקס)' : 'כך הלקוח רואה את האזור האישי') + ' (קריאה בלבד)</div>');
  }
  async function logout() { const s = store.get('ss_club_s'); store.set('ss_club_s', null); me = null; if (s) await api({ action: 'clubAppLogout', s }); show('stepId'); }
  $('logout').addEventListener('click', logout);
  $('formLater').addEventListener('click', logout);
  paint();
  load();
})();
</script>
<script src="/chat.js?v=5" defer></script>
