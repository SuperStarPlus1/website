  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.querySelectorAll('[data-ui]').forEach((b) => b.addEventListener('click', () => { ui = b.dataset.ui; paint(); }));

  /* ---------- birth date: three lists ---------- */
  function fillBirth() {
    const t = I[ui], d = $('bDay').value, m = $('bMonth').value, y = $('bYear').value;
    const now = new Date().getFullYear();
    $('bDay').innerHTML = '<option value="">' + t.day + '</option>' + Array.from({ length: 31 }, (_, i) => '<option>' + (i + 1) + '</option>').join('');
    $('bMonth').innerHTML = '<option value="">' + t.month + '</option>' + t.months.map((n, i) => '<option value="' + (i + 1) + '">' + n + '</option>').join('');
    $('bYear').innerHTML = '<option value="">' + t.year + '</option>' + Array.from({ length: 83 }, (_, i) => '<option>' + (now - 18 - i) + '</option>').join('');
    $('bDay').value = d; $('bMonth').value = m; $('bYear').value = y;
  }
  const birthIso = () => {
    const d = +$('bDay').value, m = +$('bMonth').value, y = +$('bYear').value;
    if (!d || !m || !y) return '';
    const dt = new Date(Date.UTC(y, m - 1, d));
    if (dt.getUTCMonth() !== m - 1) return '';
    const now = new Date(), age = now.getFullYear() - y - ((now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) ? 1 : 0);
    return age >= 18 && age <= 120 ? y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0') : '';
  };

  /* ---------- cities and streets (CBS) ---------- */
  fetch('club-data/cities.json').then((r) => r.json()).then((list) => {
    cities = list;
    $('cityList').innerHTML = list.map((c) => '<option value="' + esc(c[1]) + '">').join('');
    list.forEach((c) => cityByName.set(norm(c[1]), c));
    onCity();
  }).catch(() => {});
  const norm = (s) => String(s).replace(/[׳']/g, "'").replace(/[-־]/g, ' ').replace(/\s+/g, ' ').trim();
  let streetsFor = null;
  function onCity() {
    const c = cityByName.get(norm($('city').value));
    cityCode = c ? c[0] : null;
    if (c && $('city').value !== c[1]) $('city').value = c[1];
    if (!c || streetsFor === c[0]) { streetHelp(); return; }
    streetsFor = c[0]; $('streetList').innerHTML = '';
    if (c[2]) fetch('club-data/s/' + c[0] + '.json').then((r) => r.json()).then((s) => {
      if (streetsFor === c[0]) $('streetList').innerHTML = s.map((n) => '<option value="' + esc(n) + '">').join('');
    }).catch(() => {});
    streetHelp();
  }
  function streetHelp() {
    const c = cityCode && cities.find((x) => x[0] === cityCode);
    $('streetHelp').textContent = !c ? '' : c[2] ? I[ui].streetPick : I[ui].streetNone;
  }
  $('city').addEventListener('change', onCity);
  $('city').addEventListener('input', () => { if (cityByName.has(norm($('city').value))) onCity(); });

  /* ---------- checks (the server checks the same) ---------- */
  const idOk = (raw) => {
    const d = raw.replace(/\D/g, ''); if (d.length < 5 || d.length > 9) return false;
    const id = d.padStart(9, '0'); let s = 0;
    for (let i = 0; i < 9; i++) { let n = +id[i] * ((i % 2) + 1); if (n > 9) n -= 9; s += n; }
    return s % 10 === 0 && id !== '000000000';
  };
  const NAME = /^[א-ת؀-ۿa-zA-Z'"׳״\-. ]{2,40}$/;
  const checks = {
    firstName: () => NAME.test($('firstName').value.trim()),
    lastName: () => NAME.test($('lastName').value.trim()),
    idNumber: () => idOk($('idNumber').value),
    birthDate: () => !!birthIso(),
    city: () => !!cityCode,
    street: () => $('street').value.trim().length >= 2,
    houseNo: () => /^\d{1,4}[א-תa-zA-Z]?(\/\d{1,3})?$/.test($('houseNo').value.replace(/\s+/g, '')),
    phone: () => /^05\d{8}$/.test($('phone').value.replace(/[^\d+]/g, '').replace(/^\+?972/, '0')),
    email: () => /^[^\s@<>"]+@[^\s@<>"]+\.[a-z]{2,}$/i.test($('email').value.trim()),
    language: () => !!document.querySelector('[name=language]:checked'),
    acceptTerms: () => $('acceptTerms').checked,
    acceptMarketing: () => $('acceptMarketing').checked,
  };
  const fieldEl = { birthDate: ['bDay', 'bMonth', 'bYear'], language: [], acceptTerms: ['c-acceptTerms'], acceptMarketing: ['c-acceptMarketing'] };
  function mark(k, ok) {
    const e = $('e-' + k);
    e.dataset.k = ok ? '' : k; e.textContent = ok ? '' : I[ui].e[k];
    (fieldEl[k] || [k]).forEach((id) => $(id).setAttribute('aria-invalid', ok ? 'false' : 'true'));
    return ok;
  }
  Object.keys(checks).forEach((k) => {
    const ids = fieldEl[k] ? (k === 'language' ? [] : fieldEl[k].map((x) => x.replace('c-', ''))) : [k];
    ids.forEach((id) => $(id).addEventListener('blur', () => { if ($('e-' + k).dataset.k || $(id).value) mark(k, checks[k]()); }));
    ids.forEach((id) => $(id).addEventListener('change', () => { if ($('e-' + k).dataset.k) mark(k, checks[k]()); }));
  });
  document.querySelectorAll('[name=language]').forEach((r) => r.addEventListener('change', () => mark('language', true)));

  /* ---------- send ---------- */
  $('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    onCity();
    const bad = Object.keys(checks).filter((k) => !mark(k, checks[k]()));
    $('formErr').textContent = '';
    if (bad.length) {
      $('formErr').textContent = I[ui].e.form;
      const first = (fieldEl[bad[0]] || [bad[0]])[0] || 'form';
      ($(first) || $('form')).scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    const btn = $('send'); btn.disabled = true; btn.textContent = I[ui].sending;
    const body = { action: 'clubSubmit', uiLang: ui, website: $('website').value,
      firstName: $('firstName').value.trim(), lastName: $('lastName').value.trim(), idNumber: $('idNumber').value.trim(), birthDate: birthIso(),
      cityCode, city: $('city').value.trim(), street: $('street').value.trim(), houseNo: $('houseNo').value.trim(),
      phone: $('phone').value.trim(), email: $('email').value.trim(), language: document.querySelector('[name=language]:checked').value,
      acceptTerms: $('acceptTerms').checked, acceptMarketing: $('acceptMarketing').checked };
    let r;
    try { r = await (await fetch(window.APP_CONFIG.API_URL, { method: 'POST', body: JSON.stringify(body) })).json(); }
    catch (e) { r = { ok: false, error: I[ui].e.net }; }
    btn.disabled = false; btn.textContent = I[ui].send;
    if (!r.ok) { (r.fields || []).forEach((k) => checks[k] && mark(k, false)); $('formErr').textContent = r.error || I[ui].e.net; return; }
    $('card').innerHTML = '<div class="done"><div class="big">✓</div><h2>' + esc(I[ui].doneT(body.firstName)) + '</h2><p>' + I[ui].done1 + '</p><p style="color:#64748b">' + I[ui].done2 + '</p></div>';
    window.scrollTo({ top: $('card').offsetTop - 20, behavior: 'smooth' });
  });

  paint();
})();
</script>
</body>
</html>
