<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>הגשת מועמדות</title>
<!-- The public apply page of a job (same file in Sidurit web/app/ and on the Superstar site root — there the config line
     below is replaced). The link: apply.html?job=<token> (Sidurit: &c=<company>). Server: jobPublic / applyJob in
     _shared/recruit-handlers.ts (a hidden field + a minimum fill time against bots, 3 a day per phone / e-mail). -->
<script>window.APP_CONFIG = { API_URL: 'https://otjhhljgdevazanrretx.supabase.co/functions/v1/api' }; window.companySlug = () => '';</script>
<style>
  :root{--navy:#1b2a4a;--line:#e5e7eb;--muted:#6b7280;--bg:#f4f6fb;--card:#fff;--err:#b91c1c;--ok:#166534}
  @media (prefers-color-scheme: dark){:root{--navy:#c7d2fe;--line:#334155;--muted:#94a3b8;--bg:#0f172a;--card:#1e293b;--err:#fca5a5;--ok:#86efac}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--navy);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
  main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  h1{font-size:22px;margin:0 0 4px}.co{color:var(--muted);font-size:14px;margin-bottom:10px}
  .desc{white-space:pre-wrap;font-size:14.5px;margin:10px 0 14px}
  label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:13.5px;margin-bottom:10px}
  input,textarea{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-weight:400;background:var(--card);color:inherit;width:100%}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.row{grid-template-columns:1fr}}
  .consent{flex-direction:row;align-items:flex-start;gap:8px;font-weight:400;font-size:13px}.consent input{width:auto;margin-top:4px}
  button{background:#1b2a4a;color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:800;font-size:16px;width:100%;cursor:pointer}
  button:disabled{opacity:.6}
  .err{color:var(--err);font-weight:700;min-height:20px;margin:6px 0}.ok{color:var(--ok);font-weight:800;font-size:17px;text-align:center;padding:20px 0}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .muted{color:var(--muted);font-size:12.5px}
  .pic{width:100%;border-radius:12px;display:block;margin:0 0 12px}
</style>
</head>
<body>
<main><div class="card" id="box"><p class="muted">טוען…</p></div></main>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const e = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const qs = new URLSearchParams(location.search);
  const token = qs.get('job') || '';
  const company = (window.companySlug && window.companySlug()) || '';
  const api = async (body) => {
    try {
      const r = await fetch(window.APP_CONFIG.API_URL, { method: 'POST', body: JSON.stringify(Object.assign(company ? { company } : {}, body)) });
      return await r.json();
    } catch (_) { return { ok: false, error: 'אין חיבור לשרת — נסה/י שוב' }; }
  };
  const started = Date.now();
  const toB64 = (f) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });

  async function load() {
    const box = $('box');
    if (!token) { box.innerHTML = '<p class="err">הקישור חסר — בקש/י את הקישור המלא למשרה.</p>'; return; }
    const j = await api({ action: 'jobPublic', token });
    if (!j.ok) { box.innerHTML = (j.closed ? '<h1>' + e(j.title) + '</h1><div class="co">' + e(j.company) + '</div>' : '') + '<p class="err">' + e(j.error || 'המשרה לא נמצאה') + '</p>' +
      (j.jobsUrl ? '<p><a href="' + e(j.jobsUrl) + '">למשרות הפעילות ←</a></p>' : ''); return; }
    document.title = 'הגשת מועמדות — ' + j.title;
    box.innerHTML = (j.imageUrl ? '<img class="pic" src="' + e(j.imageUrl) + '" alt="">' : '') + '<h1>' + e(j.title) + '</h1><div class="co">' + e(j.company) + ' · ' + e(j.department) + ' · ' + e(j.branch) + '</div>' +
      (j.description ? '<div class="desc">' + e(j.description) + '</div>' : '') +
      '<form id="f" novalidate>' +
      '<label>שם מלא<input id="fullName" autocomplete="name" required maxlength="80"></label>' +
      '<div class="row"><label>טלפון<input id="phone" type="tel" autocomplete="tel" inputmode="tel" dir="ltr"></label>' +
      '<label>מייל<input id="email" type="email" autocomplete="email" dir="ltr"></label></div>' +
      '<div class="row"><label>עיר מגורים<input id="city" autocomplete="address-level2"></label>' +
      '<label>ת.ז. (לא חובה)<input id="idNumber" inputmode="numeric" dir="ltr"></label></div>' +
      '<label>ספר/י קצת על עצמך — ניסיון, זמינות<textarea id="summary" rows="4" maxlength="4000"></textarea></label>' +
      '<label>קורות חיים (לא חובה — PDF, Word או תמונה)<input id="cv" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"></label>' +
      '<div class="hp" aria-hidden="true"><label>אתר<input id="website" tabindex="-1" autocomplete="off"></label></div>' +
      '<label class="consent"><input type="checkbox" id="consent"> אני מאשר/ת ל-' + e(j.company) + ' לשמור את הפרטים וקורות החיים לצורך גיוס, וליצור איתי קשר</label>' +
      '<div class="err" id="err"></div><button id="go">שליחת מועמדות</button>' +
      '<p class="muted">טלפון או מייל — לפחות אחד מהם.</p></form>';
    $('f').addEventListener('submit', submit);
  }
  async function submit(ev) {
    ev.preventDefault();
    const err = $('err');
    if (!$('consent').checked) { err.textContent = 'יש לאשר את השימוש בפרטים'; return; }
    const f = $('cv').files[0];
    if (f && f.size > 6 * 1024 * 1024) { err.textContent = 'הקובץ גדול מדי (עד 6MB)'; return; }
    err.textContent = ''; $('go').disabled = true; $('go').textContent = 'שולח…';
    const r = await api({ action: 'applyJob', token, fullName: $('fullName').value, phone: $('phone').value, email: $('email').value, city: $('city').value,
      idNumber: $('idNumber').value, summary: $('summary').value, consent: true, hp: $('website').value, ms: Date.now() - started,
      cv: f ? { name: f.name, mime: f.type, data: await toB64(f) } : undefined });
    $('go').disabled = false; $('go').textContent = 'שליחת מועמדות';
    if (!r.ok) { err.textContent = r.error || 'שגיאה — נסה/י שוב'; return; }
    $('box').innerHTML = '<div class="ok">✅ המועמדות נשלחה — תודה!<br><span class="muted" style="font-weight:400">ניצור איתך קשר אם יש התאמה.</span></div>';
  }
  load();
})();
</script>
</body>
</html>
