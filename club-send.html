<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>שליחת הודעות למועדון — סופרסטאר</title>
<link rel="icon" href="logo.png">
<!-- The customer club's SMS sending page — on the marketing site, apart from the management system. In with a one-time
     code by e-mail to an allowed address (api/club.ts clubSendCode / clubSendVerify); the session token stays in this
     browser tab only. The page itself: club-send.js. -->
<style>
  :root { --blue: #0076DA; --navy: #1b2a4a; --ink: #1f2937; --muted: #64748b; --line: #dbe3ec; --bad: #b91c1c; --ok: #166534; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef4fa; color: var(--ink); font: 15px/1.5 "Segoe UI", Tahoma, Arial, sans-serif; }
  .top { background: #fff; border-bottom: 1px solid var(--line); }
  .top .in { max-width: 920px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 12px; }
  .top img { height: 40px; } .top h1 { font-size: 17px; margin: 0; flex: 1; }
  .top .who { color: var(--muted); font-size: 13px; }
  main { max-width: 920px; margin: 0 auto; padding: 16px; }
  .btn { border: 1.5px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn:disabled { opacity: .55; cursor: default; }
  .login { max-width: 400px; margin: 40px auto; background: #fff; border-radius: 16px; padding: 22px; box-shadow: 0 8px 30px rgba(0, 60, 120, .08); }
  .login h2 { margin: 0 0 6px; } .login p { color: var(--muted); margin: 0 0 14px; }
  .login input { width: 100%; border: 2px solid var(--line); border-radius: 10px; padding: 11px 12px; font: inherit; margin-bottom: 10px; direction: ltr; text-align: right; }
  .login input.code { text-align: center; font-size: 24px; letter-spacing: 8px; font-weight: 800; }
  .login .btn { width: 100%; padding: 11px; }
  .err { color: var(--bad); font-weight: 700; min-height: 1em; margin-top: 8px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { border: 1.5px solid #d1d5db; background: #fff; border-radius: 99px; padding: 6px 14px; font: inherit; font-weight: 700; cursor: pointer; }
  .tabs button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .box { border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; margin-bottom: 12px; background: #fff; }
  h4 { margin: 0 0 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  .row > label.c { flex: 1 1 130px; min-width: 0; }
  label.c { display: grid; gap: 3px; font-size: 13px; font-weight: 700; }
  select, input[type=text], input[type=tel], input[type=email], textarea { border: 1.5px solid #d1d5db; border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13.5px; width: 100%; }
  textarea { box-sizing: border-box; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; } th, td { border-bottom: 1px solid #f1f5f9; padding: 4px 6px; text-align: right; }
  .bad { color: var(--bad); } .ok { color: var(--ok); } .note { font-size: 12.5px; color: var(--muted); }
  .warn { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-bottom: 10px; }
  .stats { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; } .stats span { background: #f1f5f9; border-radius: 99px; padding: 2px 10px; font-size: 12.5px; }
  .bar { height: 8px; background: #e5e7eb; border-radius: 99px; overflow: hidden; margin-top: 6px; } .bar i { display: block; height: 100%; background: var(--blue); width: 0; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; border-radius: 99px; padding: 8px 18px; font-weight: 700; z-index: 9; }
  .toast.err { background: var(--bad); }
</style>
</head>
<body>
<header class="top"><div class="in"><img src="logo.png" alt="סופרסטאר"><h1>📣 מועדון לקוחות — שליחת הודעות</h1><span class="who" id="who"></span><button class="btn" id="out" hidden>יציאה</button></div></header>
<main id="app"></main>
<script src="club-send.js"></script>
</body>
</html>
